apiVersion: apps/v1
kind: Deployment
metadata:
  name: ams-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ams-api
  template:
    metadata:
      labels:
        app: ams-api
    spec:
      containers:
        - name: api
          image: ams-api:local
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ams-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ams-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ams-api
spec:
  selector:
    app: ams-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ams-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ams-web
  template:
    metadata:
      labels:
        app: ams-web
    spec:
      containers:
        - name: web
          image: ams-web:local
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ams-web
spec:
  selector:
    app: ams-web
  ports:
    - port: 80
      targetPort: 80
